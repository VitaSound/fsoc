schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Проект: fsoc — Forth-native SoC builder (аналог LiteX): платы, тулчейны, CSR, J1, прошивка.
  Ядро HDL — fhdlgen. Ядра звука/MIDI — hdl-modules.
  Правила агента: AGENTS.md.
  Проверка: fmix test, flint, fcov.

  Слои:
  - rtl/ — лист Verilog
  - designs/ — топ fhdlgen
  - boards/ — платформа
  - targets/ — тулчейн без имени задачи
  - emu/ — консоль pin/uart
  - projects/<задача>_<эмуляция-или-плата>/ — рабочий каталог; в git только target.4th, остальное пишет --build
  - fsoc — билдер; задача и плата в target.4th, не в аргументах команды

  Уже сделано:
  - rtl/blinky.v с LED_BIT=25 и счётчиком = 0
  - топ из designs/blinky_top.4th
  - каталоги blinky_emul, blinky_vitasound_ep4ce10, blinky_rz_easyfpga; в git только target.4th, top.v пишет emit
  - эмуляция Verilator 4.038, такт 50 МГц из C++ (полупериод 10 нс), реалтайм до Ctrl+C
  - консоль печатает t=<ns> pin led <значение> только при смене уровня
  - uart того же вида (t=<ns> uart <имя> <байт>), blinky этот канал не вызывает
  - clk50→clk, user_led→led
  - VitaSound: PIN_23 и PIN_86, DEVICE EP4CE10E22C8
  - RZ-EasyFPGA: PIN_87, DEVICE EP4CE6E22C8

rules:
  specs:
    - Scenario формулировать через Forth-DSL и ожидаемые артефакты (.v, .qsf, csr.4th)
  design:
    - Не сплющивать дизайн в один Verilog; иерархия через файлы и инстансы
    - "Абстракции не просачиваются. designs/ не называет каталог проекта, плату и способ запуска: путь выходного файла задаёт вызывающий. targets/ не знает имя задачи. boards/ не знает задачу. emu/ — только общая консоль pin/uart; main задачи лежит рядом с задачей. Нижний слой не подставляет каталог верхнего, если путь не передан"
    - Таргет не знает имя задачи (blinky). Имя задачи и плата живут в target.4th
    - "setenv в Gforth не вызывать: вызов падает. FSOC_* передавать в строке system; оболочка может экспортировать переменные до старта Gforth"
    - Путь брать через get-dir. expand-file ищет по Forth-пути и может взять чужой файл
    - "Пути репозитория только от FSOC_HOME (fsoc-path); каталог проекта — cwd, читается один раз в project%"
    - IF и abort" только внутри определения
    - "next-arg сразу копировать в свой буфер: следующий разбор затирает строку аргумента"
    - fhdlgen вызывать как ${FHDLGEN_HOME:-$HOME/fhdlgen}/bin/fhdlgen build <design> --out <dir>; дизайн не читает окружение
    - Строки через fjson.str-concat / fsoc-cat+; списки через ulist-each; задачи не определяют свои cp/mkdir/pick
  tasks:
    - Новое поведение покрывать fmix test

operations:
  apply:
    guidance:
      - Перед завершением прогонять fmix test; обновлять CHANGELOG.md
